[package]
name = "saf-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "CLI binary for the Static Analyzer Factory"

[lib]
name = "saf_cli"
path = "src/lib.rs"

[[bin]]
name = "saf"
path = "src/main.rs"

[features]
default = ["llvm-18"]
llvm-18 = ["saf-frontends/llvm-18"]
llvm-22 = ["saf-frontends/llvm-22"]

[dependencies]
saf-core = { workspace = true, features = ["logging-subscriber"] }
saf-frontends = { workspace = true }
saf-analysis = { workspace = true, features = ["z3-solver", "analysis-mta"] }
saf-svcomp = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
glob = { workspace = true }
tracing-subscriber = { workspace = true }
# `saf verify` writes clang/opt temp IR into a throwaway dir (plan 192, slice 1).
tempfile = { workspace = true }
# Native-replay harness reaping: PR_SET_PDEATHSIG + process-group kill so a hung sanitizer harness
# cannot orphan and leak (the 2026-08-19 load-runaway root cause). Linux-only; SV-COMP runs on Linux.
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
saf-test-utils = { path = "../saf-test-utils" }
