id: saf
name: SAF
description: |
  SAF (Static Analyzer Factory) is a verifier for C programs, written in Rust.
  It is a bug finder first: an LLVM-IR frontend feeds an abstract-interpretation
  core (intervals, pointer and value-flow analyses), and candidate violations are
  driven to concrete counterexamples by SAF's own bounded model checker (bit-precise
  SMT via a statically linked Z3), a symbolic interpreter, and a coverage-guided
  fuzzer. A violation is reported only after native replay under a sanitizer
  reproduces it, together with a violation witness. On the proof side SAF is
  conservative: it answers "true" only where its exact-semantics symbolic
  execution or its abstract domains discharge the property, and "unknown"
  otherwise. SAF bundles no other verifier.
input_languages:
  - C
