# PROPOSED fm-tools entry for SAF, to be added as data/saf.yml in
# https://gitlab.com/sosy-lab/benchmarking/fm-tools
#
# Every value marked "REPLACE-ME" (and the two 0000-... placeholders) must be
# filled in by a human before the merge request is opened; see
# submission/REGISTRATION.md for the list and for why CI rejects each of them.
#
# Key order is fixed by ci/check-data.py:validate_property_order().
# Do not reorder.
id: saf
name: SAF
description: |
  SAF (Static Analyzer Factory) is a verifier for C, written in Rust, that is a
  bug finder first. Its strength is refuting specifications: an LLVM-IR frontend
  feeds an abstract-interpretation core (intervals, octagons, pointer and
  value-flow analyses) that narrows the search, and candidate violations are then
  driven to a concrete counterexample by SAF's own bounded model checker (SSA
  encoding into bit-precise SMT solved by a statically linked Z3), a symbolic
  interpreter, and a coverage-guided fuzzer with targeted input generation. A
  candidate is only reported as a violation after it has been replayed natively:
  SAF compiles the original program with clang-18 plus the synthesized inputs and
  observes the failure under AddressSanitizer, UndefinedBehaviorSanitizer, or
  ThreadSanitizer, and only then emits a violation witness. On the proof side SAF
  is deliberately conservative and abstains: it answers "true" only for the small
  set of tasks its abstract domains and linear ranking functions can discharge
  soundly, and prints "unknown" everywhere else rather than guess. SAF bundles no
  other verifier.
